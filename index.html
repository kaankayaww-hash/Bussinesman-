<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tıklama Oyunu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #121212;
            color: white;
            margin: 0;
            padding: 20px;
        }
        #game-container {
            max-width: 400px;
            margin: auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            border: none;
            border-radius: 5px;
            background-color: #ff9800;
            color: white;
        }
        button:hover {
            background-color: #e68900;
        }
        #car-list {
            margin-top: 20px;
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid #444;
            padding: 10px;
            text-align: left;
        }
        /* Gizli sayfa (Modal) tasarımı */
        #secret-page {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        /* Yanıp sönen kırmızı buton efekti */
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }
        #red-button {
            background-color: #ff3b30;
            color: white;
            font-size: 20px;
            padding: 15px 30px;
            border-radius: 50px;
            animation: pulse 1.5s infinite;
            border: none;
            cursor: pointer;
        }
        #blue-trigger-btn {
            background-color: #007aff;
            width: 100%;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <h1>Para: <span id="money">10000</span> $</h1>
        <h2>Tıklama Gücü: <span id="click-power">1</span></h2>
        <button onclick="clickMoney()">Para Kazan</button>
        
        <br><br>
        <button onclick="buyUpgrade()">Tıklama Yükseltmesi (Fiyat: <span id="upgrade-cost">50</span> $)</button>

        <h3>Arabalar</h3>
        <div id="car-list">
            <p>Araba 1 - 500 $</p>
            <p>Araba 2 - 1200 $</p>
            <p>Araba 3 - 3000 $</p>
            <p>Araba 4 - 7000 $</p>
            <!-- Listenin en altına koyduğumuz ufak mavi buton -->
            <button id="blue-trigger-btn" onclick="openSecretPage()">Özel Sayfaya Git</button>
        </div>
    </div>

    <!-- Gizli Sayfa -->
    <div id="secret-page">
        <h2>Gizli 1 Milyon Dolar Sayfası!</h2>
        <p>Aşağıdaki yanıp sönen butona bas ve parayı kap!</p>
        <button id="red-button" onclick="getMillionaire()">1 Milyon Dolar Al!</button>
        <br><br>
        <button onclick="closeSecretPage()" style="background-color: #555;">Geri Dön</button>
    </div>

    <script>
        let money = 10000; // Başlangıç parası 10.000 dolar
        let clickPower = 1;
        let upgradeCost = 50;

        function clickMoney() {
            money += clickPower;
            updateUI();
        }

        function buyUpgrade() {
            if (money >= upgradeCost) {
                money -= upgradeCost;
                clickPower += 1;
                upgradeCost = Math.floor(upgradeCost * 1.5);
                updateUI();
            } else {
                alert("Yeterli paran yok!");
            }
        }

        function updateUI() {
            document.getElementById("money").innerText = money;
            document.getElementById("click-power").innerText = clickPower;
            document.getElementById("upgrade-cost").innerText = upgradeCost;
        }

        function openSecretPage() {
            document.getElementById("secret-page").style.display = "flex";
        }

        function closeSecretPage() {
            document.getElementById("secret-page").style.display = "none";
        }

        function getMillionaire() {
            money = 1000000; // Her tıklama başı 1 milyon dolar yapar
            updateUI();
            closeSecretPage();
            alert("Tebrikler, artık 1 Milyon Dolarsın!");
        }

        updateUI();
    </script>

</body>
</html>
